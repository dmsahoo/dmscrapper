# Build file of the rcm_intelligence wheel.
# The CI pipeline builds it (python -m build --wheel) and the bundle installs it on the job clusters.
# The app installs the same package from the repository root (requirements.txt).
# Third party libraries are not install requirements of the wheel: they are pinned in the job
# definitions (resources/*.yml) and in requirements.txt, from the approved package source.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcm_intelligence"
dynamic = ["version"]
description = "Regulatory Change Management, internal zone: copy, ingest, Vector Search, Regulator Agent, Q and A Agent and guardrails"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.3", "PyYAML==6.0.2"]

[tool.setuptools.dynamic]
version = {attr = "rcm_intelligence.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rcm_intelligence.ddl" = ["*.sql"]
"rcm_intelligence.prompts" = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
