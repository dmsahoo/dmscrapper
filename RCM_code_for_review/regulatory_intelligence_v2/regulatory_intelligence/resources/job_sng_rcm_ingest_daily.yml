# Ingest and analysis job: parse and chunk the new documents, sync the Vector Search index, and run
# the Regulator Agent. Started by job_sng_rcm_copy_daily after each copy (no own schedule).
# The index sync and the analysis run even if some documents failed to parse (Run if: All done),
# because the documents that succeeded are already saved.
resources:
  jobs:
    job_sng_rcm_ingest_daily:
      name: job_sng_rcm_ingest_daily
      description: RCM ingest and analysis. Bronze, Silver and Gold, Vector Search sync, Regulator Agent.
      max_concurrent_runs: 1
      tags:
        project: rcm
        use_case_id: rcm
        branch: sng
        environment: ${bundle.target}
      email_notifications:
        on_failure:
          - ${var.alert_email}
      job_clusters:
        - job_cluster_key: rcm_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
            spark_env_vars:
              RCM_ENV: ${bundle.target}
              RCM_CONFIG_DIR: ${workspace.file_path}/config
              RCM_RELEASE_TAG: ${var.release_tag}
              RCM_LOG_LEVEL: INFO
      tasks:
        - task_key: 01_parse_chunk
          job_cluster_key: rcm_cluster
          notebook_task:
            notebook_path: ../notebooks/03_ingest_rcm_parse_chunk.py
          libraries:
            - whl: ../dist/*.whl
        - task_key: 02_index_sync
          depends_on:
            - task_key: 01_parse_chunk
          run_if: ALL_DONE
          job_cluster_key: rcm_cluster
          notebook_task:
            notebook_path: ../notebooks/04_index_rcm_doc_chunk.py
            base_parameters:
              mode: SYNC
          libraries:
            - whl: ../dist/*.whl
            - pypi: {package: "openai==${var.openai_version}"}
            - pypi: {package: "mlflow==${var.mlflow_version}"}
            - pypi: {package: "databricks-sdk==${var.databricks_sdk_version}"}
        - task_key: 03_regulator_analysis
          depends_on:
            - task_key: 01_parse_chunk
          run_if: ALL_DONE
          job_cluster_key: rcm_cluster
          notebook_task:
            notebook_path: ../notebooks/05_agent_rcm_regulator.py
            base_parameters:
              max_documents: "100"
          libraries:
            - whl: ../dist/*.whl
            - pypi: {package: "openai==${var.openai_version}"}
            - pypi: {package: "mlflow==${var.mlflow_version}"}
            - pypi: {package: "databricks-sdk==${var.databricks_sdk_version}"}
