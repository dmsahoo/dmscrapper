# Build file of the rcm_scraper wheel.
# The CI pipeline builds it (python -m build --wheel) and the bundle installs it on the job clusters.
# Third party libraries (Playwright, PyYAML, azure-storage-blob) are not listed as install
# requirements: PyYAML and azure-storage-blob come with the Databricks Runtime, and Playwright is
# installed by the cluster init script from the approved package source. This keeps pip from
# fetching anything from the internet when the wheel is installed.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcm_scraper"
dynamic = ["version"]
description = "Regulatory Change Management scraper: collects regulator publications, versions them and records the malware scan verdict"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.3", "PyYAML==6.0.2"]

[tool.setuptools.dynamic]
version = {attr = "rcm_scraper.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rcm_scraper.ddl" = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
