# Set up job: creates the tables and the monitoring views. No schedule.
# Run once per environment by the deployment workflow, and again after a change to the SQL files.
resources:
  jobs:
    job_sng_rcm_scraper_setup:
      name: job_sng_rcm_scraper_setup
      description: RCM scraper set up. Creates the schema objects, tables and monitoring views.
      max_concurrent_runs: 1
      tags:
        project: rcm
        use_case_id: rcm
        branch: sng
        environment: ${bundle.target}

      job_clusters:
        - job_cluster_key: setup_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
            spark_env_vars:
              RCM_ENV: ${bundle.target}
              RCM_CONFIG_DIR: ${workspace.file_path}/config

      tasks:
        - task_key: 01_table_creation
          job_cluster_key: setup_cluster
          notebook_task:
            notebook_path: ../notebooks/00_table_creation_rcm_scraper.py
          libraries:
            - whl: ../dist/*.whl
        - task_key: 02_view_creation
          depends_on:
            - task_key: 01_table_creation
          job_cluster_key: setup_cluster
          notebook_task:
            notebook_path: ../notebooks/01_view_creation_rcm_scraper.py
          libraries:
            - whl: ../dist/*.whl
