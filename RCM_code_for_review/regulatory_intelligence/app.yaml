# Databricks App: Regulatory Scanner (deployed from the repository root, so it can use the shared folders)
command: ['streamlit', 'run', 'app/app.py']
env:
  # Which config file to use: config/dev.yaml, config/uat.yaml or config/prod.yaml
  - name: RCM_ENV
    value: dev
  # SQL warehouse, from the app's sql-warehouse resource
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Guardrail keys, from the app's secret resources (interim; an Entra identity is the production option)
  - name: CONTENT_SAFETY_KEY
    valueFrom: content-safety-key
  - name: LANGUAGE_KEY
    valueFrom: language-key
  # Send the agent traces to MLflow. The experiment path is set in app.py from the config
  - name: MLFLOW_TRACKING_URI
    value: databricks
